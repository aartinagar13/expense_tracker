{% extends 'expenses/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center">

    <div class="card shadow-lg rounded-4 p-4" style="max-width: 450px; width: 100%; border: 1px solid #e0e0e0; background: #ffffff;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Login</h2>
            <p class="text-muted small">Welcome back! Please login to continue.</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                Invalid username or password
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required>
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>

            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-success btn-lg rounded-pill shadow-sm">
                    Login
                </button>
            </div>
        </form>

        <p class="mt-3 text-center small text-muted">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </p>

    </div>

</div>

<style>
/* Input focus effect */
input.form-control {
    border-radius: 0.5rem;
    transition: 0.3s ease;
}
input.form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
}

/* Card hover effect */
.card {
    transition: 0.3s ease;
}
.card:hover {
    transform: translateY(-3px);
}
</style>
{% endblock %}
