{% extends 'expenses/base.html' %}
{% block title %}Add Budget{% endblock %}

{% block content %}
<div class="container mt-4">
<div class="card p-4 shadow rounded-4" style="max-width:500px;margin:auto;">
<h4 class="mb-3">Set Monthly Budget</h4>

<!-- <form method="post">
{% csrf_token %}
{{ form.as_p }}

<button class="btn btn-success w-100">Save Budget</button>
</form> -->
<form method="post">
    {% csrf_token %}
    <div class="mb-2">
        <label>Category</label>
        <select name="category" class="form-select" required>
            {% for category in CATEGORY_CHOICES %}
                <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-2">
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" class="form-control" required>
    </div>

    <div class="mb-2">
        <label>Month</label>
        <select name="month" class="form-select" required>
            {% for m in months %}
                <option value="{{ m }}" {% if m == selected_month %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-2">
        <label>Year</label>
        <input type="number" name="year" class="form-control" value="{{ selected_year }}" required>
    </div>

    <button type="submit" class="btn btn-success">Add Budget</button>
</form>

</div>
</div>
{% endblock %}
